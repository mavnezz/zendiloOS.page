<!doctype html>
<!-- The preview images for shared links, assets/img/og-{en,de}.jpg: served
     from the repository root, shot at 1200 × 630 (?lang=de for German). -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Geist'; src: url('../assets/fonts/geist.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Archivo'; src: url('../assets/fonts/archivo.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: 'JetBrains Mono'; src: url('../assets/fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 100 800; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { font-family: 'Geist', sans-serif; color: #fff; background: #1f43f5; position: relative; }
.left { position: absolute; left: 64px; top: 56px; bottom: 56px; width: 640px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 14px; font-family: 'Archivo'; font-stretch: 112%; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.brand img { width: 48px; height: 48px; border-radius: 11px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.3); }
h1 { margin-top: 40px; font-family: 'Archivo'; font-stretch: 122%; font-size: 66px; line-height: 0.96; font-weight: 800; letter-spacing: -0.035em; }
h1 em { font-style: normal; color: #c8ff3d; }
p.lead { margin-top: 26px; width: 520px; font-size: 22px; line-height: 1.4; color: rgba(255,255,255,0.88); }
.facts { margin-top: auto; display: flex; gap: 22px; font-family: 'JetBrains Mono'; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; }
.facts span + span { padding-left: 22px; border-left: 1px solid rgba(255,255,255,0.4); }
.shot { position: absolute; left: 730px; top: 96px; width: 760px; height: 475px; border-radius: 12px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(11,13,18,.5), 0 30px 70px -20px rgba(11,13,18,0.6); }
.shot img { width: 760px; display: block; }
</style></head>
<body>
<div class="left">
<div class="brand"><img src="../favicon.svg" alt="">zendiloOS</div>
<h1 id="t"></h1>
<p class="lead" id="l"></p>
<div class="facts"><span>Apache-2.0</span><span>Debian 13</span><span>ZFS</span></div>
</div>
<div class="shot"><img src="../assets/img/hero-dark.webp" alt=""></div>
<script>
const de = new URLSearchParams(location.search).get('lang') === 'de'
document.getElementById('t').innerHTML = de ? 'Das Open-Source-NAS ohne <em>Haken</em>.' : 'The open-source NAS, no <em>strings attached</em>.'
document.getElementById('l').textContent = de
  ? 'Kein Konto, kein Abo, keine Telemetrie. ZFS-Speicher, freigegebene Ordner, Docker-Apps und signierte Updates im Browser.'
  : 'No account, no subscription, no telemetry. ZFS storage, shared folders, Docker apps and signed updates in your browser.'
</script>
</body></html>
